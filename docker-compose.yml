services:
    db:
        image: postgres:15
        environment:
            POSTGRES_DB: ${DATABASE_NAME:-sil_store}
            POSTGRES_USER: ${DATABASE_USER:-postgres}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-root}
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql/data

    web:
        build: .
        env_file:
            - ./api/.env
        ports:
            - "8010:8010"
        depends_on:
            - db
        volumes:
            - .:/app
        command:
            [
                "gunicorn",
                "api.wsgi:application",
                "--bind",
                "0.0.0.0:8010",
                "--workers",
                "3",
            ]

volumes:
    db_data:
