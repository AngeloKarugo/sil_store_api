name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sil_store
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      PYTHONUNBUFFERED: 1
      DATABASE_NAME: sil_store
      DATABASE_USER: postgres
      DATABASE_PASSWORD: root
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      # Disable OIDC discovery in CI to avoid network calls
      OIDC_OP_DISCOVERY_ENDPOINT: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          python - <<'PY'
import time
import psycopg
for i in range(20):
    try:
        conn = psycopg.connect(host='127.0.0.1', port=5432, dbname='sil_store', user='postgres', password='root')
        conn.close()
        print('postgres ready')
        break
    except Exception as e:
        print('waiting for postgres...', e)
        time.sleep(1)
else:
    raise SystemExit('Postgres not ready')
PY

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Run tests
        run: |
          python manage.py test

  build-and-publish:
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_PASSWORD != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sil_store_api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sil_store_api:${{ github.sha }}

      - name: Upload image metadata
        if: ${{ secrets.DOCKERHUB_USERNAME == '' }}
        run: echo "Docker credentials not provided; skipped push"
        
`  deploy:
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        run: |
          echo "${KUBE_CONFIG_DATA}" | base64 --decode > $HOME/.kube/config
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Helm upgrade
        run: |
          helm upgrade --install sil-store ./helm/sil-store \
            --namespace sil-store --create-namespace \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/sil_store_api \
            --set image.tag=${{ github.sha }}
