name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    tests:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_DB: sil_store
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: root
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5

        env:
            PYTHONUNBUFFERED: 1
            DATABASE_NAME: sil_store
            DATABASE_USER: postgres
            DATABASE_PASSWORD: root
            DATABASE_HOST: 127.0.0.1
            DATABASE_PORT: 5432
            # Disable OIDC discovery in CI to avoid network calls
            OIDC_OP_DISCOVERY_ENDPOINT: ""

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.12"

            - name: Cache pip
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Wait for Postgres
              run: |
                  for i in {1..20}; do
                    if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
                      echo "Postgres is ready"
                      break
                    fi
                    echo "Waiting for Postgres..."
                    sleep 1
                  done

            - name: Run migrations
              run: python manage.py migrate --noinput

            - name: Run tests with coverage
              run: |
                  coverage run manage.py test --parallel
                  coverage report
                  coverage xml

            - name: Upload coverage to GitHub summary
              run: |
                  echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
                  coverage report >> $GITHUB_STEP_SUMMARY

    docker:
        runs-on: ubuntu-latest
        needs: tests
        env:
            DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
            DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

        steps:
            - uses: actions/checkout@v4

            - name: Log in to DockerHub
              if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_PASSWORD != '' }}
              uses: docker/login-action@v3
              with:
                  username: ${{ env.DOCKERHUB_USERNAME }}
                  password: ${{ env.DOCKERHUB_PASSWORD }}

            - name: Build and push Docker image
              if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_PASSWORD != '' }}
              uses: docker/build-push-action@v5
              with:
                  push: true
                  tags: ${{ env.DOCKERHUB_USERNAME }}/myapp:latest

            - name: Skip Docker push (no secrets provided)
              if: ${{ env.DOCKERHUB_USERNAME == '' }}
              run: echo "Skipping Docker push because secrets are missing."
